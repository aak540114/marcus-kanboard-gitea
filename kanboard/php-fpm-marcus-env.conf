; Additive PHP-FPM env passthrough for two variables the base image's own
; /etc/php84/php-fpm.d/env.conf does NOT forward to PHP-FPM workers:
; SESSION_HANDLER and DB_WAL_MODE.
;
; Root cause (confirmed empirically against a live container, not assumed):
; PHP-FPM clears almost all process environment variables from what PHP
; scripts see by default (clear_env, upstream default "yes") — only
; variables explicitly listed with `env[VARNAME] = $VARNAME` in an
; included *.conf file survive into the worker's environment. Kanboard's
; own image ships exactly such an allowlist at
; /etc/php84/php-fpm.d/env.conf, covering dozens of documented settings
; (DB_DRIVER, DB_TIMEOUT, API_AUTHENTICATION_TOKEN, ...) — but SESSION_
; HANDLER and DB_WAL_MODE are simply not on that list. Setting them in
; docker-compose.yml's `environment:` block alone is therefore a no-op
; for anything served over HTTP: `docker exec ... printenv` and `php -r
; 'getenv(...)'` (PHP-CLI) both correctly show the value, because both
; inherit the container's full process environment directly — but a real
; web request (a PHP-FPM worker) sees `getenv('SESSION_HANDLER') ===
; false`, so app/constants.php's `getenv('SESSION_HANDLER') ?: 'db'`
; silently falls back to 'db' regardless of what the container's env
; says, reproducing the exact "database is locked" SessionHandler crash
; SESSION_HANDLER=file was supposed to eliminate.
;
; This file is loaded from the SAME include directory as env.conf (and
; therefore inherits the already-open [www] pool context that env.conf's
; own bare `env[...] = ...` lines rely on — see that file for the
; precedent), so it only needs to ADD these two missing entries, not
; redeclare the pool or anything env.conf already covers.
env[SESSION_HANDLER] = $SESSION_HANDLER
env[DB_WAL_MODE] = $DB_WAL_MODE
