; Replacement for kanboard/kanboard:v1.2.53's own
; /etc/php84/php-fpm.d/env.conf, bind-mounted over that exact path.
;
; Why a full replacement rather than an additional file: this image's
; php-fpm.conf loads env.conf by EXACT FILENAME
; (`include = /etc/php84/php-fpm.d/env.conf`), not a directory-wide
; glob — confirmed directly against a live container. A sibling file
; under a different name in the same directory is silently never read
; at all. A second `include =` line was also considered and rejected:
; PHP-FPM's own config parser treats a second `include` directive
; within one file as an error ("two includes at the same time!"),
; which would have broken Kanboard entirely rather than just failing
; to forward two env vars. Replacing this file's CONTENT (same single
; include path Kanboard already trusts) is the only mechanism that is
; both correct and safe.
;
; Why this is needed at all: PHP-FPM clears almost all process
; environment variables from what PHP scripts see by default
; (clear_env, upstream default "yes") — only variables explicitly
; listed here with `env[VARNAME] = $VARNAME` survive into a worker's
; environment. This file, as shipped by the base image, is exactly
; such an allowlist covering dozens of documented Kanboard settings —
; but SESSION_HANDLER and DB_WAL_MODE are absent from it. Setting them
; in docker-compose.yml's `environment:` block alone is therefore a
; no-op for anything served over HTTP: `docker exec ... printenv` and
; `php -r 'getenv(...)'` (PHP-CLI) both show the value correctly,
; because both inherit the container's full process environment
; directly — but a real web request (a PHP-FPM worker) sees
; getenv('SESSION_HANDLER') === false, so app/constants.php's
; `getenv('SESSION_HANDLER') ?: 'db'` silently falls back to 'db'
; regardless, reproducing the exact "database is locked"
; SessionHandler crash SESSION_HANDLER=file was supposed to eliminate.
;
; Everything below down to the SESSION_HANDLER/DB_WAL_MODE lines is an
; EXACT copy of the base image's own env.conf (verified against a live
; kanboard/kanboard:v1.2.53 container — the tag root docker-compose.yml
; pins) — re-verify against a live container if that pinned version is
; ever bumped, since a future image could add/remove entries here and
; this bind mount would silently keep the old list.
env[DATABASE_URL] = $DATABASE_URL
env[API_AUTHENTICATION_TOKEN] = $API_AUTHENTICATION_TOKEN

; Data directory location
env[DATA_DIR] = $DATA_DIR

; Files directory (attachments)
env[FILES_DIR] = $FILES_DIR

; Cache folder (file driver)
env[CACHE_DIR] = $CACHE_DIR

; Plugins settings
env[PLUGINS_DIR] = $PLUGINS_DIR
env[PLUGIN_API_URL] = $PLUGIN_API_URL
env[PLUGIN_INSTALLER] = $PLUGIN_INSTALLER

; Enable/disable debug
env[DEBUG] = $DEBUG

; Logging drivers: syslog, stdout, stderr, system or file
env[LOG_DRIVER] = $LOG_DRIVER

; Logging file
env[LOG_FILE] = $LOG_FILE

; Application version
env[APP_VERSION] = $APP_VERSION

; Run automatically database migrations
env[DB_RUN_MIGRATIONS] = $DB_RUN_MIGRATIONS

; Database driver: sqlite, mysql or postgres
env[DB_DRIVER] = $DB_DRIVER

; Sqlite configuration
env[DB_FILENAME] = $DB_FILENAME

; Mysql/Postgres configuration
env[DB_USERNAME] = $DB_USERNAME
env[DB_PASSWORD] = $DB_PASSWORD
env[DB_HOSTNAME] = $DB_HOSTNAME
env[DB_NAME] = $DB_NAME
env[DB_PORT] = $DB_PORT
env[DB_SSL_KEY] = $DB_SSL_KEY
env[DB_SSL_CERT] = $DB_SSL_CERT
env[DB_SSL_CA] = $DB_SSL_CA
env[DB_VERIFY_SERVER_CERT] = $DB_VERIFY_SERVER_CERT
env[DB_TIMEOUT] = $DB_TIMEOUT

; Database backend group provider
env[DB_GROUP_PROVIDER] = $DB_GROUP_PROVIDER
env[DB_USER_PROVIDER] = $DB_USER_PROVIDER

; LDAP configuration
env[LDAP_AUTH] = $LDAP_AUTH
env[LDAP_SERVER] = $LDAP_SERVER
env[LDAP_PORT] = $LDAP_PORT
env[LDAP_SSL_VERIFY] = $LDAP_SSL_VERIFY
env[LDAP_START_TLS] = $LDAP_START_TLS
