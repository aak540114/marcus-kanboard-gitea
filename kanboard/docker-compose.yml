# kanboard/docker-compose.yml
#
# Standalone Kanboard deployment — runs only Kanboard with the
# MarcusDevEnv plugin pre-installed.  Use this when Kanboard lives on
# a different server from Marcus and Gitea (e.g. Railway, Fly.io, VPS).
#
# Quick start (VPS / local)
# -------------------------
#   cd kanboard/
#   MARCUS_URL=https://your-marcus-server.example.com \
#     docker compose up -d
#
# Railway
# -------
#   Push this directory to its own GitHub repo (or a Railway monorepo
#   service pointing to kanboard/) and set the env vars below in the
#   Railway dashboard.  Railway will build from kanboard/Dockerfile.
#
# Environment variables
# ---------------------
# MARCUS_URL        Public base URL of your Marcus server, e.g.
#                   https://marcus.example.com  (no trailing slash).
#                   The plugin uses this to reach /api/active-agents and
#                   /api/ticket-links.
#
# KANBOARD_WEBHOOK_TOKEN  (optional) Shared secret between Kanboard and
#                   Marcus.  Set the same value in Marcus's env as
#                   KANBOARD_WEBHOOK_TOKEN.  Leave blank to skip
#                   webhook token validation (not recommended in prod).
#
# After starting
# --------------
# 1. Visit http://<host>:8080  (default credentials: admin / admin)
#    Change the password immediately.
# 2. Settings → API — copy the API token; set it on Marcus:
#      export KANBOARD_API_TOKEN=<token>
# 3. Settings → Integrations → Webhook URL:
#      https://your-marcus-server.example.com/webhooks/kanboard
#    This sends real-time push events to Marcus so it reacts instantly
#    to column moves and assignment changes.
# 4. Create a project and add columns:
#      Ready | In Progress | Waiting for Human | Blocked | Done

services:
  kanboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanboard
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - kanboard_data:/var/www/app/data
    environment:
      MARCUS_URL: "${MARCUS_URL:-http://localhost:4298}"
      KANBOARD_WEBHOOK_TOKEN: "${KANBOARD_WEBHOOK_TOKEN:-}"
      # SQLite lock-contention hardening — see the matching block in the
      # root docker-compose.yml for the full explanation. Short version:
      # Kanboard's own PicoDb driver has no retry-on-lock, and this is a
      # long-standing upstream issue (kanboard/kanboard#3845, #4362,
      # #5248). SESSION_HANDLER=file moves the single highest-frequency
      # writer (a session row on every page load) off this SQLite file
      # entirely — the actual fix for the observed SessionHandler->write()
      # crash. DB_WAL_MODE pins WAL explicitly (already Kanboard's own
      # default, belt-and-suspenders). DB_TIMEOUT is SQLite's own
      # busy_timeout — a genuine internal retry-with-backoff loop, raised
      # well past PicoDb's 30s default (but deliberately bounded, not
      # unbounded — PHP-FPM has a finite worker pool, so an unbounded wait
      # under sustained contention would freeze the whole UI instead of
      # surfacing an occasional error).
      #
      # IMPORTANT — SESSION_HANDLER and DB_WAL_MODE here do nothing on
      # their own: PHP-FPM clears almost all env vars from what PHP
      # scripts actually see, and this image's own env allowlist
      # (php-fpm.d/env.conf) doesn't cover either variable — confirmed
      # empirically (a real web request sees getenv('SESSION_HANDLER')
      # === false even though `docker exec ... printenv`/`php -r` both
      # show it correctly, since those bypass PHP-FPM entirely). The
      # Dockerfile in this directory appends env[] lines for these two
      # directly onto that same env.conf at build time to actually
      # forward them — see its own comment for the full explanation
      # (including why a separate sibling file / a second `include =`
      # line were tried first and don't work). DB_TIMEOUT doesn't have
      # this problem (it IS on env.conf's allowlist); it's a no-op for
      # the separate reason explained in the root docker-compose.yml.
      SESSION_HANDLER: "file"
      DB_WAL_MODE: "true"
      DB_TIMEOUT: "300"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  kanboard_data:
